[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prc-ai-research-assistant"
version = "0.1.0"
description = "A step-by-step RAG learning project for PRC aviation documents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
